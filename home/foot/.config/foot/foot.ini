# ============ foot 1.27.0 ============

# ---- top-level options (no [main] section) ----

# default shell
shell=/usr/bin/zsh

# font and size
# 不再使用 niri 时去掉 weight，获得正常的渲染。
font=JetBrains Mono NL:size=11:weight=semibold

# initial window size (columns x rows)
initial-window-size-chars=100x30

# padding (horizontal x vertical)
pad=5x5

# ---- scrollback ----
[scrollback]
lines=10000

# ---- cursor ----
[cursor]
style=block
blink=no

# ---- mouse ----
[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

# ---- URL ----
[url]
launch=firefox

# ---- colors (dark theme) ----
[colors-dark]
# background opacity (1.0 = opaque)
alpha=0.7

background=0e1416
foreground=dee3e5

# cursor color and text color beneath cursor
cursor=dee3e5 bfc8ca

selection-background=4dd0e1
selection-foreground=000000

urls=00bcd4

regular0=0e1416
regular1=fd1c5b
regular2=00d413
regular3=ffed00
regular4=00b2c9
regular5=005762
regular6=00bcd4
regular7=c3dbde

bright0=758789
bright1=ff3f82
bright2=4cfe5c
bright3=fff24c
bright4=22d2e9
bright5=4ceaff
bright6=8cf2ff
bright7=f2fdff

# ---- key bindings ----
[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
show-urls-launch=Control+Shift+o
search-start=Control+Shift+r
