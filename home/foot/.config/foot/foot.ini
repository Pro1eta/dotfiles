# ============ foot 1.27.0 配置 ============

# ---- 顶层选项（无 [main] 段） ----

# 默认 shell
shell=/usr/bin/zsh

# 字体与字号
font=JetBrains Mono NL:size=11

# 初始窗口尺寸（列 x 行）
initial-window-size-chars=100x30

# 内边距（水平x垂直）
pad=5x5

# ---- 滚动 ----
[scrollback]
lines=10000

# ---- 光标 ----
[cursor]
style=block
blink=no

# ---- 鼠标 ----
[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

# ---- URL ----
[url]
launch=firefox

# ---- 颜色（暗色主题） ----
[colors-dark]
# 背景透明度（1.0 = 不透明）
alpha=0.7

background=0e1416
foreground=dee3e5

# 光标颜色 + 光标下文字颜色
cursor=dee3e5 bfc8ca

selection-background=4dd0e1
selection-foreground=000000

urls=00bcd4

regular0=0e1416
regular1=fd1c5b
regular2=00d413
regular3=ffed00
regular4=00b2c9
regular5=005762
regular6=00bcd4
regular7=c3dbde

bright0=758789
bright1=ff3f82
bright2=4cfe5c
bright3=fff24c
bright4=22d2e9
bright5=4ceaff
bright6=8cf2ff
bright7=f2fdff

# ---- 快捷键 ----
[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
show-urls-launch=Control+Shift+o
search-start=Control+Shift+r
