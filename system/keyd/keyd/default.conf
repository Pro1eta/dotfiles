# keyd config - vim-style navigation + symbol layers (dual trigger)
# Install: /etc/keyd/default.conf (stow-managed: system/keyd/keyd/default.conf)
#
# Layer layout:
#   [main]         base layer (default)
#   [lower]        active while Caps or [ is held; exits on release
#   [lower+shift]  triggered with physical Shift, or Caps+Space (oneshot shift)
#
# Emergency exit: backspace+escape+enter force-quits keyd (built-in)
#
# Key names: keyd list-keys / sudo keyd monitor
# Caveats: no inline comments; key lines must not be indented
#
# [lower]        hjkl=directions, w b=word jump, 0 g f=home/C-home/search,
#                n m , . / -> [ ] - = \, u y p r=undo/copy/paste/redo,
#                x=delete, d=backspace, a=C-a, space=oneshot shift
# [lower+shift]  n m , . / -> { } _ + |, hjkl=shift-select, w b=select word,
#                4 g=end/C-end

[ids]

*

[main]

# tap = ESC, hold = [lower]
capslock = overload(lower, esc)

# right-side trigger: tap = literal [, hold = [lower]
[ = overload(lower, [)

[lower]

# vim navigation
h = left
j = down
k = up
l = right
w = C-right
b = C-left
0 = home
g = C-home
f = C-f

# symbols: n m , . / -> [ ] - = \
n = [
m = ]
comma = -
dot = =
slash = backslash

# vim editing
u = C-z
y = C-c
p = C-v
r = C-r
x = delete
d = backspace
a = C-a

# Caps+Space: oneshot shift for the next keypress
space = oneshot(shift)

[lower+shift]

# symbol variants: n m , . / -> { } _ + |
n = {
m = }
comma = _
dot = +
slash = |

# text selection
h = S-left
j = S-down
k = S-up
l = S-right
w = C-S-right
b = C-S-left

# line/file end
4 = end
g = C-end
