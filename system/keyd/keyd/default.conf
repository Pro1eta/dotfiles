# keyd 配置 - vim 风格 + 符号层 + 双侧触发
# 安装: /etc/keyd/default.conf (stow 管理: system/keyd/keyd/default.conf)
#
# ============================================================
# 层结构
# ============================================================
#   [main]          普通层 (平时)
#   [lower]         按住 Caps 或 [ 时激活, 松开即退出
#   [lower+shift]   按住 Caps/[ 且同时按住 Shift 时激活
#
# 逃生: backspace+escape+enter 强制终止 keyd (内置)
#
# ============================================================
# 映射表
# ============================================================
#  按住时 (临时层, 松开退出)
#  ─────────────────────────────
#  Caps 或 [  → 层触发键 (轻按保持原义: Caps=ESC, [ = 输出 [ )
#
#  [lower] 层
#  ─────────────
#  vim 导航
#    h j k l   → ← ↓ ↑ →      方向键
#    w b       → C-right/left  词级移动
#    0 g f     → home/C-home/C-f  行首/文件头/搜索
#  符号 (n m , . / → [ ] - = \)
#    n m       → [  ]
#    , .       → -  =
#    /         → \
#  vim 编辑
#    u y p r   → C-z/C-c/C-v/C-r  undo/copy/paste/redo
#    x         → delete    (vim x: 删除光标后)
#    d         → backspace (退格: 删除光标前)
#    a         → C-a
#  回车
#    ;         → enter
#
#  [lower+shift] 层
#  ─────────────────────
#  符号变体 (n m , . / → { } _ + |)
#    n m       → {  }
#    , .       → _  +
#    /         → |
#  选中
#    h j k l   → S-left/down/up/right  选中文本
#    w b       → C-S-right/left        选中词
#  行尾/文件尾
#    4 g       → end/C-end
#
# ============================================================
# 键名参考: keyd list-keys / sudo keyd monitor
# 注意: keyd 不支持行内注释; 键定义行不得有前导空白
# ============================================================

[ids]

*

[main]

# 双触发: 轻按=ESC, 按住=[lower] 层
capslock = overload(lower, esc)

# 右侧 Cap: 轻按=输出 [, 按住=[lower] 层 (与 Caps 同层)
[ = overload(lower, [)

[lower]

# ── vim 导航 ──
h = left
j = down
k = up
l = right
w = C-right
b = C-left
0 = home
g = C-home
f = C-f

# ── 符号: n m , . / → [ ] - = \ ──
n = [
m = ]
comma = -
dot = =
slash = backslash

# ── vim 编辑 ──
u = C-z
y = C-c
p = C-v
r = C-r
x = delete
d = backspace
a = C-a

# ── 回车 ──
semicolon = enter

# [lower+shift]: 按住 Caps/[ 同时按住 Shift
[lower+shift]

# ── 符号变体: n m , . / → { } _ + | ──
n = {
m = }
comma = _
dot = +
slash = |

# ── 选中 ──
h = S-left
j = S-down
k = S-up
l = S-right
w = C-S-right
b = C-S-left

# ── 行尾/文件尾 ──
4 = end
g = C-end
