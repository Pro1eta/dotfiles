# keyd 配置 - Caps 组合键层
# 安装位置: /etc/keyd/default.conf (由 stow 管理: system/keyd/keyd/default.conf)
#
# 设计:
#   - 轻按 Caps = ESC  (现代键盘惯例)
#   - 按住 Caps = 进入 [lower] 层, 松开即退出 (momentary layer, 无需退出按钮)
#   - 按住 Caps+Shift = 进入 [lower+shift] 复合层, 输出 | { } _ + 符号
#   - Cap+Space = 按下 shift, 临时进入 [lower+shift] 打出 | { } 等符号
#   - 安全逃生序列: backspace+escape+enter 强制终止 keyd (内置)
#
# 键名参考: keyd list-keys / sudo keyd monitor 可查看实际键名
# 注意: 符号可用字面字符(如 [ ] { } _ +)或键名(backslash); 反斜杠建议用键名 backslash

[ids]

*

[main]

# Caps: 轻按=ESC, 按住=lower 层
capslock = overload(lower, esc)

[lower]

# 符号输出: Cap+Y → \  |  Cap+U → [  {  Cap+I → ]  }  Cap+O → -  _  Cap+P → =  +
y = backslash
u = [
i = ]
o = -
p = =
# 编辑/导航:
e = enter
semicolon = backspace
h = left
j = down
k = up
l = right
# Cap+Space = 临时按 shift → 输出 | { } _ + 等符号 (oneshot: 按一次修饰, 下一次按键生效)
space = oneshot(shift)

# [lower+shift]: 按住 Caps 的同时按住 Shift (或 Cap+Space) → 输出 shift 符号
[lower+shift]

y = |
u = {
i = }
o = _
p = +
h = C-left
j = C-down
k = C-up
l = C-right
